name: Baseline OCR reproduction
on:
  push:
    branches: [backport/stage1-baseline-probe]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
jobs:
  engine:
    name: Unchanged baseline OCR fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 88231f40230a20aff8bcd00eeb3e7c96b4b0e15c
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-checks
      - name: Reproduce original OCR assertion
        run: cargo test --locked -p pdfcraft-engine --lib recognize_text_makes_a_scanned_page_searchable -- --exact tests::recognize_text_makes_a_scanned_page_searchable --nocapture
